<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 200" width="330" height="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Kruhová zahrada o průměru 20 m obklopená chodníkem široký 1 m (obrázek není v měřítku)</title>
  <circle cx="130" cy="100" r="82" fill="#d6d3d1" stroke="#0D1B3E" stroke-width="2"/>
  <circle cx="130" cy="100" r="70" fill="#dcfce7" stroke="#0D1B3E" stroke-width="2"/>
  <text x="130" y="105" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">zahrada</text>
  <line x1="60" y1="126" x2="200" y2="126" stroke="#2E6DA4" stroke-width="1.4"/>
  <line x1="60" y1="122" x2="60" y2="130" stroke="#2E6DA4" stroke-width="1.4"/>
  <line x1="200" y1="122" x2="200" y2="130" stroke="#2E6DA4" stroke-width="1.4"/>
  <text x="130" y="144" font-size="13" font-weight="700" fill="#0D1B3E" text-anchor="middle">průměr 20 m</text>
