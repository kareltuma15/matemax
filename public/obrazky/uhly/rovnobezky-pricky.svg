<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <!-- CERMAT úloha 7: r ∥ s, t ⊥ s; příčky p, q se protínají v bodě R na r.
       Ilustrační (neměřit). Dané: 40° a 115° u R. Hledané: α, β, γ. -->
  <line x1="30" y1="66" x2="330" y2="66" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="30" y1="196" x2="330" y2="196" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="280" y1="50" x2="280" y2="214" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="208" y1="48" x2="140" y2="196" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="214" y1="54" x2="45" y2="196" stroke="#0D1B3E" stroke-width="2"/>
  <!-- značky rovnoběžnosti na r a s (vpravo, mimo dění) -->
  <path d="M300,62 l6,4 M306,62 l6,4" stroke="#0D1B3E" stroke-width="1.4"/>
  <path d="M300,192 l6,4 M306,192 l6,4" stroke="#0D1B3E" stroke-width="1.4"/>
  <!-- kolmost s a t -->
  <path d="M268,196 L268,184 L280,184" fill="none" stroke="#0D1B3E" stroke-width="1.4"/>
  <!-- obloučky úhlů (zvětšené, aby vyšly popiskům naproti) -->
  <path d="M162.0,66.0 A38,38 0 0,0 170.9,90.4" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <path d="M193.7,79.6 A15,15 0 0,0 215.0,66.0" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <path d="M164.8,95.6 A46,46 0 0,0 180.6,107.7" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <path d="M145.5,184.2 A13,13 0 0,1 153.0,196.0" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <path d="M64.9,179.3 A26,26 0 0,1 71.0,196.0" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <!-- bod R -->
  <circle cx="200" cy="66" r="2.6" fill="#0D1B3E"/>
  <text x="206" y="55" font-size="12" font-weight="700" fill="#0D1B3E">R</text>
  <!-- dané úhly u R (blízko svým obloučkům) -->
  <text x="139" y="89" font-size="12.5" font-weight="700" fill="#2E6DA4">40°</text>
  <text x="199" y="93" font-size="12.5" font-weight="700" fill="#2E6DA4">115°</text>
  <!-- hledaný γ mezi příčkami -->
  <text x="159" y="118" font-size="13" font-weight="700" fill="#2E6DA4">γ</text>
  <!-- hledané α a β u přímky s -->
  <text x="155" y="188" font-size="13" font-weight="700" fill="#2E6DA4">α</text>
  <text x="78" y="187" font-size="13" font-weight="700" fill="#2E6DA4">β</text>
  <!-- popisky přímek -->
  <text x="318" y="58" font-size="12.5" font-weight="700" fill="#0D1B3E">r</text>
  <text x="318" y="188" font-size="12.5" font-weight="700" fill="#0D1B3E">s</text>
  <text x="286" y="58" font-size="12.5" font-weight="700" fill="#0D1B3E">t</text>
  <text x="124" y="211" font-size="12.5" font-weight="700" fill="#0D1B3E">p</text>
  <text x="32" y="211" font-size="12.5" font-weight="700" fill="#0D1B3E">q</text>
</svg>
