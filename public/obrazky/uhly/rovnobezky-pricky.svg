<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="340" height="220">
  <!-- Úloha typu CERMAT 7: r ∥ s, t ⊥ s; příčky p, q se protínají v bodě R na r.
       Ilustrační (neměřit). Dané: úhel 40° a 115° u R. Hledané: α, β, γ. -->
  <!-- rovnoběžky r, s a kolmice t -->
  <line x1="25" y1="68" x2="305" y2="68" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="25" y1="182" x2="305" y2="182" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="252" y1="52" x2="252" y2="198" stroke="#0D1B3E" stroke-width="2"/>
  <!-- značky rovnoběžnosti (dvojité) na r a s -->
  <path d="M214,64 l6,4 M220,64 l6,4" stroke="#0D1B3E" stroke-width="1.4"/>
  <path d="M214,178 l6,4 M220,178 l6,4" stroke="#0D1B3E" stroke-width="1.4"/>
  <!-- značka kolmosti u průsečíku s a t -->
  <path d="M240,182 L240,170 L252,170" fill="none" stroke="#0D1B3E" stroke-width="1.4"/>
  <!-- příčky p a q bodem R -->
  <line x1="194" y1="48" x2="132" y2="182" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="201" y1="53" x2="59" y2="182" stroke="#0D1B3E" stroke-width="2"/>
  <!-- bod R a průsečíky P, Q -->
  <circle cx="185" cy="68" r="2.6" fill="#0D1B3E"/>
  <text x="189" y="62" font-size="12" font-weight="700" fill="#0D1B3E">R</text>
  <!-- úhlové obloučky u R -->
  <path d="M163,68 A22,22 0 0,0 169.5,83" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <path d="M201,68 A16,16 0 0,0 178.5,79.5" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <!-- popisky daných úhlů a hledaných -->
  <text x="150" y="88" font-size="12.5" font-weight="700" fill="#2E6DA4">40°</text>
  <text x="204" y="92" font-size="12.5" font-weight="700" fill="#2E6DA4">115°</text>
  <text x="171" y="100" font-size="13" font-weight="700" fill="#2E6DA4">γ</text>
  <!-- α u průsečíku p a s -->
  <path d="M150,182 A18,18 0 0,0 138,165" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <text x="140" y="171" font-size="13" font-weight="700" fill="#2E6DA4">α</text>
  <!-- β u průsečíku q a s -->
  <path d="M77,182 A18,18 0 0,0 65,166" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <text x="66" y="172" font-size="13" font-weight="700" fill="#2E6DA4">β</text>
  <!-- popisky přímek -->
  <text x="293" y="63" font-size="12.5" font-weight="700" fill="#0D1B3E">r</text>
  <text x="293" y="178" font-size="12.5" font-weight="700" fill="#0D1B3E">s</text>
  <text x="256" y="64" font-size="12.5" font-weight="700" fill="#0D1B3E">t</text>
  <text x="123" y="196" font-size="12.5" font-weight="700" fill="#0D1B3E">p</text>
  <text x="47" y="196" font-size="12.5" font-weight="700" fill="#0D1B3E">q</text>
</svg>
