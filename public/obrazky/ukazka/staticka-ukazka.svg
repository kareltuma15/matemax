<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <!-- Ukázka statického obrázku (dlouhý ocas). Průhledné pozadí, tmavé tahy. -->
  <polygon points="60,150 160,40 260,150" fill="none" stroke="#0D1B3E" stroke-width="2"/>
  <line x1="160" y1="40" x2="160" y2="150" stroke="#2E6DA4" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="110" y="170" font-size="13" fill="#2E6DA4" text-anchor="middle" font-weight="600">a = 10 cm</text>
  <text x="152" y="128" font-size="13" fill="#2E6DA4" text-anchor="end" font-weight="600">v = 8 cm</text>
  <text x="160" y="30" font-size="14" fill="#0D1B3E" text-anchor="middle" font-weight="700">C</text>
</svg>
