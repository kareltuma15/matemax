<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="350" height="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Trojúhelník ABC se stranami a = 9 cm, b = 20 cm a neznámou stranou c</title>
  <polygon points="24,172 262,172 274.35,46.61" fill="#eef4fb" stroke="#0D1B3E" stroke-width="2" stroke-linejoin="round"/>
  <text x="14" y="186" font-size="14" font-weight="700" fill="#0D1B3E" text-anchor="middle">A</text>
  <text x="258" y="188" font-size="14" font-weight="700" fill="#0D1B3E" text-anchor="middle">B</text>
  <text x="278.35" y="38.61" font-size="14" font-weight="700" fill="#0D1B3E" text-anchor="middle">C</text>
  <text x="141.18" y="97.3" font-size="13" font-weight="600" fill="#2E6DA4" text-anchor="middle" transform="rotate(-26.6 141.18 97.3)">b = 20 cm</text>
  <text x="286.35" y="113.3" font-size="13" font-weight="600" fill="#2E6DA4" text-anchor="start">a = 9 cm</text>
